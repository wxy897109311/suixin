<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>随手账 V0.2</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#159866">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="随手账">
<meta name="description" content="一句话记账：语音/文字智能识别收支，账单本地保存，隐私安全，可离线使用。">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17181b;--muted:#8a9099;--line:#e9ebef;--green:#159866;--red:#e95760;--blue:#386cf6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}.app{max-width:1160px;margin:auto;padding:24px 22px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:23px;font-weight:800}.date{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 22px rgba(20,25,35,.035)}.summary{padding:25px}.label{font-size:13px;color:var(--muted)}.balance{font-size:40px;font-weight:800;margin:7px 0 22px;letter-spacing:-1px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fafbfc;padding:14px;border-radius:14px}.amount{font-size:21px;font-weight:750;margin-top:5px}.income{color:var(--green)}.expense{color:var(--red)}
.section{padding:21px}.section h2{font-size:17px;margin:0 0 15px}.bill{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.bill:last-child{border-bottom:0}.icon{width:39px;height:39px;border-radius:12px;background:#f3f5f7;display:grid;place-items:center}.bill-main{flex:1;min-width:0}.bill-name{font-weight:650}.bill-meta{font-size:12px;color:var(--muted);margin-top:4px}.bill-money{font-weight:700;white-space:nowrap}.input-card{grid-column:1/-1;padding:22px}.input-wrap{display:flex;align-items:flex-end;gap:9px;border:1px solid #d9dde3;border-radius:18px;padding:13px 14px;background:#fff}.input-wrap:focus-within{border-color:#aeb7c4;box-shadow:0 0 0 3px rgba(56,108,246,.07)}textarea{flex:1;min-height:72px;resize:none;border:0;outline:0;line-height:1.6;font-size:16px}.tool{width:44px;height:44px;border:0;border-radius:12px;cursor:pointer}.mic{background:#f1f3f6;transition:.2s}.mic.recording{background:#ffe8ea;color:#e95760;animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.send{background:#17181b;color:#fff}.hint{font-size:12px;color:var(--muted);margin-top:9px}.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:17px;padding:6px;display:flex;box-shadow:0 12px 35px rgba(0,0,0,.1);z-index:5}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 20px;border-radius:11px;cursor:pointer}.nav button.active{background:#f0f2f5;color:#111;font-weight:650}
.toolbar{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:0}.select{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:23px}.modal h3{margin:0}.modal-sub{color:var(--muted);font-size:13px;margin-top:5px}.result{border:1px solid var(--line);border-radius:15px;margin:18px 0;overflow:hidden}.result-row{padding:13px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}.result-row:last-child{border:0}.result-row input,.result-row select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;width:100%}.result-icon{font-size:20px}.actions{display:flex;justify-content:flex-end;gap:9px}.actions button{border:0;border-radius:11px;padding:10px 15px;cursor:pointer}.cancel{background:#f0f2f4}.confirm{background:#17181b;color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:#17181b;color:#fff;padding:11px 16px;border-radius:12px;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);padding:22px 0;text-align:center}
.install-bar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:520px;background:#17181b;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:15;align-items:center;gap:10px}.install-bar.show{display:flex}.install-bar .ib-info{flex:1;font-size:13px;line-height:1.5;min-width:0}.install-bar button{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:650}.ib-ok{background:#159866;color:#fff}.ib-close{background:rgba(255,255,255,.15);color:#fff}
.nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
@media(max-width:760px){.app{padding-bottom:calc(95px + env(safe-area-inset-bottom))}}
@media(max-width:760px){.app{padding:16px 12px 95px}.grid{grid-template-columns:1fr}.input-card{grid-column:auto}.balance{font-size:35px}.nav{width:calc(100% - 24px);justify-content:space-around}.nav button{flex:1;padding:10px 8px}.result-row{grid-template-columns:32px 1fr}.result-row>b{grid-column:2}.top{margin-bottom:17px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">随手账</div><div class="date" id="today"></div></header>
<main id="content"></main>
</div>
<nav class="nav">
<button class="active" data-page="home">首页</button><button data-page="bills">账单</button><button data-page="analysis">分析</button><button data-page="settings">设置</button>
</nav>
<div class="modal-bg" id="modalBg"><div class="modal">
<h3>确认账单</h3><div class="modal-sub" id="modalSub"></div><div class="result" id="result"></div>
<div class="actions"><button class="cancel" onclick="closeModal()">取消</button><button class="confirm" onclick="confirmRecords()">确认记录</button></div>
</div></div>
<div class="install-bar" id="installBar"><div class="ib-info"><b>安装「随手账」到手机</b><br>添加到桌面，像普通 App 一样使用，支持离线记账</div><button class="ib-ok" onclick="installApp()">安装</button><button class="ib-close" onclick="hideInstallBar()">暂不</button></div>
<div class="toast" id="toast"></div>
<script>
const seed=[
{name:"早餐",cat:"餐饮",icon:"🍜",amount:-18,time:"08:32",date:"今天",pay:"微信"},
{name:"打车",cat:"交通",icon:"🚕",amount:-22,time:"11:46",date:"今天",pay:"支付宝"},
{name:"午餐",cat:"餐饮",icon:"🍱",amount:-35,time:"12:15",date:"今天",pay:"微信"},
{name:"买菜",cat:"购物",icon:"🥬",amount:-86,time:"18:32",date:"今天",pay:"微信"},
{name:"工资",cat:"工资",icon:"💰",amount:8500,time:"09:00",date:"今天",pay:"银行卡"}
];
let bills=JSON.parse(localStorage.getItem("sz_bills_v02")||"null")||seed.slice();
let pending=[];
const cats=["餐饮","交通","购物","居住","娱乐","医疗","学习","工资","其他收入","其他"];
const pays=["微信","支付宝","银行卡","现金","其他"];
const fmt=n=>Math.abs(n).toLocaleString("zh-CN",{minimumFractionDigits:2});
function save(){localStorage.setItem("sz_bills_v02",JSON.stringify(bills))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function row(x,edit=false,i=0){return '<div class="bill"><div class="icon">'+(x.icon||"🧾")+'</div><div class="bill-main"><div class="bill-name">'+x.name+'</div><div class="bill-meta">'+x.cat+' · '+(x.date||"今天")+' · '+(x.pay||"未设置")+(x.time?' · '+x.time:'')+'</div></div><div class="bill-money '+(x.amount>=0?"income":"expense")+'">'+(x.amount>=0?"+":"-")+'¥'+fmt(x.amount)+'</div>'+(edit?'<button onclick="editBill('+i+')" style="border:0;background:#f1f3f5;border-radius:9px;padding:7px;cursor:pointer">编辑</button><button onclick="deleteBill('+i+')" style="border:0;background:#fff0f1;color:#d63e49;border-radius:9px;padding:7px;cursor:pointer">删除</button>':'')+'</div>'}
function totals(){return {income:bills.filter(x=>x.amount>0).reduce((a,x)=>a+x.amount,0),expense:bills.filter(x=>x.amount<0).reduce((a,x)=>a+x.amount,0)}}
function render(page="home"){
 const {income,expense}=totals(),list=bills.slice().reverse();let html="";
 if(page==="home")html='<section class="card input-card" style="margin-bottom:16px"><div class="input-wrap"><textarea id="input" placeholder="告诉我你今天的钱花到哪里了……&#10;例如：昨天买菜86，晚上吃饭128，支付宝付的"></textarea><button class="tool mic" onclick="voice()">🎙️</button><button class="tool send" onclick="parseInput()">➤</button></div><div class="hint">支持一句话记录多笔收入 / 支出 · 识别后先确认，不会直接入账</div></section><div class="grid"><section class="card summary"><div class="label">本月结余</div><div class="balance">¥ '+fmt(income+expense)+'</div><div class="stats"><div class="stat"><div class="label">收入</div><div class="amount income">¥ '+fmt(income)+'</div></div><div class="stat"><div class="label">支出</div><div class="amount expense">¥ '+fmt(expense)+'</div></div></div></section><section class="card section"><h2>今日概览</h2><div class="bill"><div class="icon">📊</div><div class="bill-main"><div class="bill-name">'+bills.length+' 笔账单</div><div class="bill-meta">本地保存 · AI整理后确认入账</div></div></div></section><section class="card section"><h2>最近账单</h2>'+list.slice(0,7).map(x=>row(x)).join("")+'</section></div>';
 else if(page==="bills")html='<section class="card section"><h2>账单</h2><div class="toolbar"><input id="search" class="search" placeholder="搜索账单、分类、备注……"><select id="filter" class="select"><option value="all">全部</option><option value="income">收入</option><option value="expense">支出</option></select></div><div id="billList"></div></section>';
 else if(page==="analysis"){const catsum={};bills.filter(x=>x.amount<0).forEach(x=>catsum[x.cat]=(catsum[x.cat]||0)+Math.abs(x.amount));html='<section class="card section"><h2>本月分析</h2><div class="stats"><div class="stat"><div class="label">收入</div><div class="amount income">¥ '+fmt(income)+'</div></div><div class="stat"><div class="label">支出</div><div class="amount expense">¥ '+fmt(expense)+'</div></div></div><h2 style="margin-top:25px">支出分类</h2>'+Object.entries(catsum).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="bill"><div class="bill-main"><div class="bill-name">'+k+'</div></div><div class="bill-money expense">¥ '+fmt(v)+'</div></div>').join("")+'</section>';
 }else html='<section class="card section"><h2>设置</h2><div class="bill"><div class="bill-main"><div class="bill-name">默认货币</div><div class="bill-meta">人民币（¥）</div></div></div><div class="bill"><div class="bill-main"><div class="bill-name">支付方式</div><div class="bill-meta">'+pays.join(" · ")+'</div></div></div><div class="bill"><div class="bill-main"><div class="bill-name">数据</div><div class="bill-meta">账单保存在当前浏览器，不上传服务器</div></div><button onclick="clearAll()" style="border:0;background:#fff0f1;color:#d63e49;border-radius:9px;padding:8px;cursor:pointer">清空</button></div><div class="bill"><div class="bill-main"><div class="bill-name">安装到桌面</div><div class="bill-meta">全屏运行 · 离线可用</div></div><button onclick="installApp()" style="border:0;background:#159866;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer">安装</button></div><div class="bill"><div class="bill-main"><div class="bill-name">版本</div><div class="bill-meta">V0.3 · PWA</div></div></div></section>';
document.getElementById("content").innerHTML=html;
if(page==="bills"){document.getElementById("search").oninput=filterBills;document.getElementById("filter").onchange=filterBills;filterBills()}
}
function filterBills(){const q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;const arr=bills.map((x,i)=>({...x,_i:i})).reverse().filter(x=>(!q||(x.name+x.cat+x.pay+x.date).toLowerCase().includes(q))&&(f==="all"||(f==="income"&&x.amount>0)||(f==="expense"&&x.amount<0)));document.getElementById("billList").innerHTML=arr.length?arr.map(x=>row(x,true,x._i)).join(""):'<div class="empty">没有找到相关账单</div>'}
function mockAI(t){
 const out=[],re=/([^，。,.；;]*?)(\d+(?:\.\d+)?)\s*(?:元|块|块钱|人民币)?/g;let m;
 while((m=re.exec(t))){let s=m[1].trim(),n=parseFloat(m[2]);if(!s)continue;let income=/(工资|奖金|收入|收到|到账|转给我|赚了|客户给了|报销)/.test(s);
 let cat=income?(/工资/.test(s)?"工资":"其他收入"):"其他",icon=income?"💰":"🧾",name=income?cat:"其他",pay=/支付宝/.test(t)?"支付宝":/微信/.test(t)?"微信":/银行卡/.test(t)?"银行卡":/现金/.test(t)?"现金":"未设置",date=/昨天/.test(t)?"昨天":/前天/.test(t)?"前天":"今天";
 if(/饭|吃|餐|咖啡|早餐|午餐|晚餐|外卖/.test(s)){cat="餐饮";icon="🍜";name=/咖啡/.test(s)?"咖啡":/外卖/.test(s)?"外卖":"餐饮"}
 else if(/车|打车|地铁|公交|加油|停车/.test(s)){cat="交通";icon="🚕";name="交通"}
 else if(/菜|水果|买菜|购物/.test(s)){cat="购物";icon="🥬";name=/买菜/.test(s)?"买菜":"购物"}
 else if(/房租|房贷|住宿/.test(s)){cat="居住";icon="🏠";name="居住"}
 out.push({name,cat,icon,amount:income?n:-n,time:"刚刚",date,pay});
 }return out;
}
function parseInput(){const t=(document.getElementById("input")?.value||"").trim();if(!t)return;pending=mockAI(t);if(!pending.length){toast("没有识别出金额");return}document.getElementById("modalSub").textContent='识别到 '+pending.length+' 笔，请确认内容后再入账';document.getElementById("result").innerHTML=pending.map((x,i)=>'<div class="result-row"><div class="result-icon">'+x.icon+'</div><div><input id="rn'+i+'" value="'+x.name+'"><select id="rc'+i+'">'+cats.map(c=>'<option '+(c===x.cat?"selected":"")+'>'+c+'</option>').join("")+'</select><select id="rp'+i+'" style="margin-top:6px">'+pays.map(c=>'<option '+(c===x.pay?"selected":"")+'>'+c+'</option>').join("")+'</select></div><b class="'+(x.amount>=0?"income":"expense")+'">'+(x.amount>=0?"+":"-")+'¥'+fmt(x.amount)+'</b></div>').join("");document.getElementById("modalBg").style.display="flex"}
function confirmRecords(){pending.forEach((x,i)=>{x.name=document.getElementById("rn"+i).value||x.name;x.cat=document.getElementById("rc"+i).value;x.pay=document.getElementById("rp"+i).value});bills.push(...pending);save();pending=[];closeModal();render("home");toast("已记录")}
function closeModal(){document.getElementById("modalBg").style.display="none"}
function deleteBill(i){if(confirm("确定删除这笔账单？")){bills.splice(i,1);save();render("bills");toast("已删除")}}
function editBill(i){const x=bills[i],name=prompt("修改名称",x.name);if(name===null)return;const a=prompt("修改金额（收入填正数，支出填负数）",x.amount);if(a===null)return;const n=Number(a);if(!Number.isFinite(n)){toast("金额格式不正确");return}x.name=name||x.name;x.amount=n;save();render("bills");toast("已修改")}
function clearAll(){if(confirm("确定清空全部本地账单？")){bills=[];save();render("home");toast("已清空")}}
let recog=null;
function voice(){
 const micBtn=document.querySelector(".mic");
 if(!("webkitSpeechRecognition"in window||"SpeechRecognition"in window)){
  toast("当前浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器");return
 }
 if(recog){try{recog.stop()}catch(e){}recog=null;micBtn?.classList.remove("recording");return}
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 const r=new R();r.lang="zh-CN";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
 r.onstart=()=>{recog=r;micBtn?.classList.add("recording");toast("正在聆听，请说话…")};
 r.onresult=e=>{
  let text="";
  for(let i=e.resultIndex;i<e.results.length;i++){text+=e.results[i][0].transcript}
  const ta=document.getElementById("input");if(ta){ta.value=text.trim()}
 };
 r.onerror=e=>{
  micBtn?.classList.remove("recording");recog=null;
  const msgs={
   "not-allowed":"麦克风权限被拒绝，请在浏览器设置中允许麦克风访问",
   "service-not-allowed":"语音服务不可用，请检查网络连接",
   "no-speech":"没有检测到语音，请再试一次",
   "audio-capture":"无法访问麦克风，请检查设备是否正常",
   "network":"语音识别需要联网，请检查网络连接"
  };
  toast(msgs[e.error]||("语音识别失败："+e.error))
 };
 r.onend=()=>{micBtn?.classList.remove("recording");recog=null};
 try{r.start()}catch(e){toast("语音启动失败，请重试")}
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem("sz_install_dismissed"))document.getElementById("installBar").classList.add("show")});
function installApp(){if(!deferredPrompt){toast("请在浏览器菜单选择『添加到主屏幕』");return}deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{hideInstallBar();deferredPrompt=null})}
function hideInstallBar(){localStorage.setItem("sz_install_dismissed","1");document.getElementById("installBar").classList.remove("show")}
window.addEventListener("appinstalled",()=>{hideInstallBar();toast("已安装到桌面 🎉")});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.page)});
document.getElementById("today").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});render();
</script></body></html>
